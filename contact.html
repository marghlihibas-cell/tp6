<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire de Contact - TP6</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <main>
        <form id="contact-form" action="#" method="POST">
            <fieldset>
                <legend>Informations personnelles</legend>

                <div class="form-group">
                    <label for="nom">Nom :</label>
                    <input type="text" id="nom" name="nom" required minlength="2" maxlength="50" placeholder="Ex: Marghli">
                </div>

                <div class="form-group">
                    <label for="prenom">Prénom :</label>
                    <input type="text" id="prenom" name="prenom" required minlength="2" maxlength="50" placeholder="Ex: Hiba">
                </div>

                <div class="form-group">
                    <label for="email">Adresse E-mail :</label>
                    <input type="email" id="email" name="email" required placeholder="exemple@domaine.tn">
                </div>

                <div class="form-group">
                    <label for="telephone">Téléphone :</label>
                    <input type="tel" id="telephone" name="telephone" maxlength="8" pattern="[0-9]{8}" title="Le numéro de téléphone doit contenir exactement 8 chiffres" placeholder="12345678">
                </div>
            </fieldset>
            <fieldset>
                <legend>Votre Message</legend>

                <div class="form-group">
                    <label for="sujet">Sujet de la demande :</label>
                    <select id="sujet" name="sujet">
                        <option value="" disabled selected>-- Sélectionnez un sujet --</option>
                        <option value="information">Demande d'information</option>
                        <option value="support">Support technique</option>
                        <option value="reclamation">Réclamation</option>
                        <option value="autre">Autre</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="ville">Ville :</label>
                    <input type="text" id="ville" name="ville" list="villes-list" placeholder="Entrez ou choisissez votre ville">
                    <datalist id="villes-list">
                        <option value="Tozeur">
                        <option value="Sousse">
                        <option value="Tunis">
                        <option value="Sfax">
                        <option value="Gafsa">
                    </datalist>
                </div>

                <div class="form-group">
                    <label for="message">Message :</label>
                    <textarea id="message" name="message" rows="5" cols="40" minlength="10" placeholder="Rédigez votre message ici (minimum 10 caractères)..."></textarea>
                </div>
            </fieldset>

            <div class="buttons-container">
                <button type="submit">Envoyer le message</button>
                <button type="reset">Effacer</button>
            </div>

        </form>
    </main>

</body>
</html>
